on:
  push:
    branches: [main, master]

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # curveRbayes (a Suggests, pulled in by needs: website's default
          # dependencies: "all") cannot be installed on a bare runner: it has
          # top-level code in R/helper-cmdstan.R (misplaced -- it's a
          # testthat helper, belongs in tests/testthat/, not a package source
          # file) that eagerly calls cmdstanr::cmdstan_path() at
          # package-load/build time, unconditionally once the cmdstanr *R
          # package* is present, regardless of whether the CmdStan *toolchain*
          # is installed. Fails with "CmdStan path has not been set yet"
          # during ordinary package install, not just on use.
          #
          # Tried restricting dependencies: "hard" first (only Imports/
          # Depends/LinkingTo) -- that broke resolution of curveRcore itself:
          # pak's "hard" dependency-type path doesn't consult the Remotes:
          # field the same way "all" does, so it looked for curveRcore on
          # CRAN and failed ("Can't find package called curveRcore"), even
          # though Remotes: immunoplex/curveRcore is right there in
          # DESCRIPTION. Ignoring the one problem package directly, via pak's
          # documented `pkg=?ignore` syntax, is more surgical and keeps the
          # normal "all" resolution path (and its Remotes handling) intact.
          #
          # Safe: no example or vignette chunk in this package actually
          # executes curveRbayes code (the sole @examplesIf-guarded example
          # mentioning it is also commented out, and every Stan-fitting
          # vignette chunk is eval = FALSE) -- confirmed by grep before
          # making this change.
          extra-packages: any::pkgdown, curveRbayes=?ignore
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
