url: https://immunoplex.github.io/curveRweights/

template:
  bootstrap: 5.0
  bootswatch: flatly

home:
  title: curveRweights
  description: Bayesian precision weighting from calibration curve uncertainty for
    the curveR suite. Joint location-scale models estimate the power-law relationship
    between se_concentration and residual variance, yielding continuous per-observation
    weights that replace binary LLOQ/ULOQ gating.

navbar:
  title: "curveRweights"
  logo:
    image: man/figures/logo_small.png
    alt: curveRweights logo
    width: 200px
    href: index.html
  structure:
    left:
    - intro
    - reference
    - articles
    right:
    - search
    - github
  components:
    github:
      icon: fa-github
      href: https://github.com/immunoplex/curveRweights
      aria-label: GitHub

articles:
- title: Guides
  navbar: ~
  contents:
  - measurement-error
  - downstream-analysis
  - precision-weighting

reference:
- title: curveR Ecosystem Entry Points
  desc: >
    The recommended API for users coming from curveRfreq or curveRbayes.
    `as_weight_data()` converts a `calibration_result(_multiplate)` into
    the standardised input frame. `fit_precision_weights()` estimates
    phi and beta1. `predict_weights()` applies fitted weights to new data.
    `join_weights()` attaches weights back onto a sample data frame.
  contents:
  - as_weight_data
  - fit_precision_weights
  - predict_weights
  - join_weights

- title: Additive measurement-error model
  desc: >
    The additive model sigma^2 = tau^2 + kappa^2 se^(2 beta1): weights are
    bounded by 1/tau^2, each sample gets a reliability, and out-of-range
    samples enter through a censored likelihood. See the measurement-error
    and downstream-analysis articles.
  contents:
  - fit_additive_weight
  - prepare_censoring
  - compute_additive_weights
  - normalize_weights
  - meas_variance

- title: Measurement-error corrections
  desc: >
    For analyses in which the noisy variable is a predictor: regression
    calibration and correction of correlations for attenuation.
  contents:
  - reliability_correct
  - attenuation_correct

- title: Precision Index Preparation
  desc: >
    Functions that compute and diagnose the precision index used as the
    scale predictor. `prepare_cv()` builds yi, cv_i, and log_cv from
    concentration and precision columns. `diagnose_cv()` checks whether
    the precision index has enough variation to identify beta1.
    `interpret_beta1()` classifies the estimated exponent into
    human-readable regimes.
  contents:
  - prepare_cv
  - diagnose_cv
  - interpret_beta1

- title: Weight Computation
  desc: >
    Deterministic weight computation from estimated scale parameters
    and summary diagnostics for the resulting weight distribution.
  contents:
  - compute_saturated_weights
  - weight_diagnostics

- title: Core Fitting Engine
  desc: >
    Lower-level functions that fit the joint Bayesian location-scale
    model via brms. `fit_saturated_weight()` fits one group;
    `fit_saturated_weight_batch()` loops over multiple groups.
    `apply_saturated_weights()` applies a saved scale_table to new
    data without refitting.
  contents:
  - fit_saturated_weight
  - fit_saturated_weight_batch
  - apply_saturated_weights

- title: Example Dataset
  desc: Anonymised Luminex multiplex immunoassay data for testing and documentation.
  contents:
  - example_assay

news:
  one_page: true
